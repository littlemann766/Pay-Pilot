name: Build Pay-Pilot Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.apk'
      - '**/*.aab'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Pay-Pilot source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/app/build.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Using Pay-Pilot source from repository root."

          elif [ -f "$GITHUB_WORKSPACE/Pay-Pilot-main.zip" ]; then
            rm -rf "$RUNNER_TEMP/pay-pilot-src"
            mkdir -p "$RUNNER_TEMP/pay-pilot-src"
            unzip -q "$GITHUB_WORKSPACE/Pay-Pilot-main.zip" -d "$RUNNER_TEMP/pay-pilot-src"

            APP_GRADLE="$(find "$RUNNER_TEMP/pay-pilot-src" -type f -path '*/app/build.gradle' -print -quit)"
            test -n "$APP_GRADLE"
            PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
            echo "Using Pay-Pilot source from Pay-Pilot-main.zip."

          else
            APP_GRADLE="$(find "$GITHUB_WORKSPACE" -type f -path '*/app/build.gradle' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)"
            test -n "$APP_GRADLE"
            PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
            echo "Using Pay-Pilot source discovered in repository."
          fi

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/VERSION.txt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Pay-Pilot project at: $PROJECT_DIR"

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          EXPECTED_VERSION="$(sed -E 's/^[Vv]ersion:[[:space:]]*//' VERSION.txt | tr -d '\r' | xargs)"
          test -n "$EXPECTED_VERSION"
          echo "$EXPECTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
          echo "Building Pay-Pilot $EXPECTED_VERSION"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f index.html
          grep -F "applicationId 'com.paypilot.app'" app/build.gradle
          grep -F "rootProject.file('VERSION.txt')" app/build.gradle
          grep -F "versionName payPilotVersion" app/build.gradle
          grep -F "versionCode payPilotVersionCode" app/build.gradle
          grep -F "syncPayPilotWebAssets" app/build.gradle
          python3 tools/verify-foundation.py
          echo "Pay-Pilot source verified for $EXPECTED_VERSION."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify signing secrets
        shell: bash
        env:
          PAYPILOT_KEYSTORE_HEX: ${{ secrets.PAYPILOT_KEYSTORE_HEX }}
          PAYPILOT_KEYSTORE_PASSWORD: ${{ secrets.PAYPILOT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PAYPILOT_KEYSTORE_HEX"
          test -n "$PAYPILOT_KEYSTORE_PASSWORD"
          echo "Signing secrets are present."

      - name: Restore signing key
        shell: bash
        env:
          PAYPILOT_KEYSTORE_HEX: ${{ secrets.PAYPILOT_KEYSTORE_HEX }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/Pay-Pilot-release.jks"
          printf '%s' "$PAYPILOT_KEYSTORE_HEX" | tr -d '[:space:]' | xxd -r -p > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "PAYPILOT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        shell: bash
        env:
          PAYPILOT_KEYSTORE_PASSWORD: ${{ secrets.PAYPILOT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:clean :app:assembleRelease :app:bundleRelease

      - name: Verify built version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          if [ -f tools/verify-apk-assets.py ]; then
            python3 tools/verify-apk-assets.py app/build/outputs/apk/release/app-release.apk
          fi
          echo "Built Pay-Pilot $EXPECTED_VERSION successfully."

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pay-pilot-release"
          mkdir -p "$RUNNER_TEMP/pay-pilot-release"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/pay-pilot-release/Pay-Pilot-$EXPECTED_VERSION.apk"
          cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" "$RUNNER_TEMP/pay-pilot-release/Pay-Pilot-$EXPECTED_VERSION.aab"
          cp "$PROJECT_DIR/VERSION.txt" "$RUNNER_TEMP/pay-pilot-release/VERSION.txt"

      - name: Upload Pay-Pilot release
        uses: actions/upload-artifact@v4
        with:
          name: Pay-Pilot-${{ env.EXPECTED_VERSION }}
          path: |
            ${{ runner.temp }}/pay-pilot-release/Pay-Pilot-${{ env.EXPECTED_VERSION }}.apk
            ${{ runner.temp }}/pay-pilot-release/Pay-Pilot-${{ env.EXPECTED_VERSION }}.aab
            ${{ runner.temp }}/pay-pilot-release/VERSION.txt
          if-no-files-found: error
